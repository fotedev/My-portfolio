y own work through a spec-gated software factory so every claim on this site can be traced to evidence.\",\"aboutCta\":\"More about me\",\"contactTitle\":\"Have a project in mind?\",\"contactBody\":\"Email is the fastest way to reach me — or send the form on the contact page. Either way it lands straight in my inbox.\",\"contactCta\":\"Get in touch\",\"proofAi\":\"Production AI \u0026 RAG systems\",\"proofOss\":\"OSS contributor — NousResearch\",\"proofSecurity\":\"Responsible security disclosure\",\"proofCert\":\"1M Prompters certified\"},\"how\":{\"s1Title\":\"Spec first\",\"s1Body\":\"Every build starts from a short written spec you approve: scope, constraints, and what \\\"done\\\" means, before any code exists.\",\"s2Title\":\"Vertical slices\",\"s2Body\":\"Work ships in thin, working slices you can open and use, not a big reveal at the end.\",\"s3Title\":\"CI-enforced gates\",\"s3Body\":\"Lint, types, tests and build run automatically on every change. Nothing merges without passing.\",\"s4Title\":\"Handover\",\"s4Body\":\"You get documentation, deployment and the keys: a system you own and understand.\"},\"projects\":{\"title\":\"Projects\",\"subtitle\":\"Selected case studies. Every claim on these pages has a dated source in the evidence log.\",\"caseStudy\":\"Case study\",\"liveDemo\":\"Live demo\",\"sourceCode\":\"Source code\",\"privateRepo\":\"Private production repo\",\"backToProjects\":\"All projects\",\"problem\":\"The problem\",\"solution\":\"What I built\",\"results\":\"Results\",\"stack\":\"Stack\",\"lastUpdated\":\"Last updated {date}\",\"notFound\":\"No published case study with this slug.\"},\"services\":{\"title\":\"Services\",\"subtitle\":\"Three engagements, each ending in something you own: deployed software, documentation and a handover.\",\"deliverables\":\"What you get\",\"cta\":\"Discuss this service\"},\"about\":{\"title\":\"About\",\"intro1\":\"I'm Ahmed Aboalayoun (fotedev), a Full-Stack AI Engineer based in Egypt, working in English and Arabic. I build web platforms, production RAG systems, and the automation and tooling around them.\",\"intro2\":\"I run my own work through a software factory: locked specs, vertical slices, CI-enforced gates and a measured run log. That is also why every claim on this site links to a dated source.\",\"factoryTitle\":\"The software factory\",\"factoryBody\":\"Milestones are gated: a spec is approved first, each slice passes lint, types, tests and a production build in CI, and results are recorded. If a claim cannot be verified, it does not ship.\",\"arsenalTitle\":\"Tech arsenal\",\"arsenalAiLabel\":\"AI \u0026 LLM\",\"arsenalAiItems\":\"RAG pipelines, pgvector, embeddings, prompt engineering, MCP tooling, agentic workflows\",\"arsenalFrontendLabel\":\"Frontend\",\"arsenalFrontendItems\":\"Next.js (App Router), React 19, TypeScript (strict), Tailwind CSS, RTL/i18n\",\"arsenalBackendLabel\":\"Backend \u0026 data\",\"arsenalBackendItems\":\"Supabase, PostgreSQL, Row Level Security, Edge Functions, Zod\",\"arsenalDevopsLabel\":\"DevOps\",\"arsenalDevopsItems\":\"GitHub Actions CI, Vercel, pnpm monorepos, deterministic release gates\",\"ossTitle\":\"Open-source record\",\"ossBody\":\"Contributions to NousResearch/hermes-agent (one merged via salvage with preserved authorship, two open) and a responsible security disclosure to MiniMax-AI, acknowledged by the vendor. Full details with dates below.\",\"certTitle\":\"Certificate\",\"certBody\":\"One Million Prompters — Certificate of Completion, credited to Dubai Future Foundation and the Dubai Centre for Artificial Intelligence. Offered here as a supporting credential, not a quality guarantee.\",\"certCta\":\"View the certificate\"},\"contact\":{\"title\":\"Contact\",\"body\":\"Use the form below or email me directly — both land in the same place, and neither is shared with anyone else.\",\"emailLabel\":\"Email\",\"copyEmail\":\"Copy email address\",\"copied\":\"Copied\",\"mailto\":\"Write an email\",\"formName\":\"Name
