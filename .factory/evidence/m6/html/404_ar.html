 معي\",\"proofAi\":\"أنظمة RAG وذكاء اصطناعي إنتاجية\",\"proofOss\":\"مساهم مفتوح المصدر في NousResearch\",\"proofSecurity\":\"إفصاح أمني مسؤول\",\"proofCert\":\"معتمد من مبادرة مليون خبير\"},\"how\":{\"s1Title\":\"المواصفة أولًا\",\"s1Body\":\"كل بناء يبدأ من مواصفة مكتوبة مختصرة توافق عليها: النطاق، والقيود، ومعنى «انتهى»، قبل كتابة أي سطر كود.\",\"s2Title\":\"شرائح عمودية\",\"s2Body\":\"يُسلَّم العمل في شرائح رقيقة تعمل فعلًا وتستطيع فتحها واستخدامها، لا في كشف واحد كبير في النهاية.\",\"s3Title\":\"بوابات يفرضها CI\",\"s3Body\":\"فحص الكود والأنواع والاختبارات والبناء تعمل تلقائيًا مع كل تغيير. لا يُدمج شيء دون اجتيازها.\",\"s4Title\":\"التسليم\",\"s4Body\":\"تحصل على التوثيق والنشر والمفاتيح: نظام تملكه وتفهمه.\"},\"projects\":{\"title\":\"المشاريع\",\"subtitle\":\"دراسات حالة مختارة. كل جملة على هذه الصفحات لها مصدر مؤرَّخ في سجل الأدلة.\",\"caseStudy\":\"دراسة حالة\",\"liveDemo\":\"عرض مباشر\",\"sourceCode\":\"الكود المصدري\",\"privateRepo\":\"مستودع إنتاجي خاص\",\"backToProjects\":\"كل المشاريع\",\"problem\":\"المشكلة\",\"solution\":\"ما بنيته\",\"results\":\"النتائج\",\"stack\":\"التقنيات\",\"lastUpdated\":\"آخر تحديث: {date}\",\"notFound\":\"لا توجد دراسة حالة منشورة بهذا المُعرّف.\"},\"services\":{\"title\":\"الخدمات\",\"subtitle\":\"ثلاثة أنواع تعاقد، كلٌّ منها ينتهي بشيء تملكه: برمجيات منشورة، وتوثيق، وتسليم.\",\"deliverables\":\"ما تحصل عليه\",\"cta\":\"ناقش هذه الخدمة\"},\"about\":{\"title\":\"نبذة\",\"intro1\":\"أنا أحمد أبو العيون (fotedev)، مهندس ذكاء اصطناعي متكامل من مصر، أعمل بالعربية والإنجليزية. أبني منصات ويب وأنظمة RAG إنتاجية والأتمتة والأدوات المحيطة بها.\",\"intro2\":\"أُدير عملي الخاص عبر مصنع برمجيات: مواصفات مقفلة، وشرائح عمودية، وبوابات يفرضها CI، وسجل تشغيل مقاس. ولهذا السبب نفسه ترتبط كل جملة على هذا الموقع بمصدر مؤرَّخ.\",\"factoryTitle\":\"مصنع البرمجيات\",\"factoryBody\":\"المراحل مُقنَّنة: تُعتمد المواصفة أولًا، وتجاوز كل شريحة فحص الكود والأنواع والاختبارات وبناء الإنتاج في CI، وتُسجَّل النتائج. إن تعذّر التحقق من جملة، فهي لا تُنشر.\",\"arsenalTitle\":\"ترسانة التقنيات\",\"arsenalAiLabel\":\"الذكاء الاصطناعي ونماذج اللغة\",\"arsenalAiItems\":\"خطوط RAG، وpgvector، والتضمينات، وهندسة الأوامر، وأدوات MCP، وسير عمل وكيلي\",\"arsenalFrontendLabel\":\"الواجهات\",\"arsenalFrontendItems\":\"Next.js (App Router)، وReact 19، وTypeScript (صارم)، وTailwind CSS، وRTL/تدويل\",\"arsenalBackendLabel\":\"الخلفية والبيانات\",\"arsenalBackendItems\":\"Supabase، وPostgreSQL، وRLS، ودوال Edge، وZod\",\"arsenalDevopsLabel\":\"DevOps\",\"arsenalDevopsItems\":\"GitHub Actions CI، وVercel، ومستودعات pnpm أحادية، وبوابات إصدار حتمية\",\"ossTitle\":\"السجل المفتوح المصدر\",\"ossBody\":\"مساهمات في NousResearch/hermes-agent (إحداها مدموجة عبر إنقاذ مع حفظ النسبة، واثنتان مفتوحتان) وإفصاح أمني مسؤول إلى MiniMax-AI أقرّ به المورّد. التفاصيل الكاملة بالتواريخ أدناه.\",\"certTitle\":\"الشهادة\",\"certBody\":\"شهادة إتمام مبادرة «مليون خيّر لأوامر الذكاء الاصطناعي» (1 Million Prompters)، تحمل شعارَي مؤسسة دبي للمستقبل ومركز دبي للذكاء الاصطناعي. تُعرض هنا كاعتماد مساند، لا كضمان جودة.\",\"certCta\":\"عرض الشهادة\"},\"contact\":{\"title\":\"تواصل\",\"body\":\"استخدم النموذج أدناه أو راسلني مباشرة — كلاهما يصل إلى المكان نفسه، ولا يُشارك أيٌّ منهما مع أي طرف آخر.\",\"emailLabel\":\"البريد الإلكتروني\",\"copyEmail\":\"نسخ عنوان البريد\",\"copied\":\"تم النسخ\",\"mailto\":\"اكتب بريدًا\",\"formName\":\"الاسم\",\"formNameError\":\"أدخل اسمك من فضلك (من 2 إلى 80 حرفًا).\",\"formEmailError\":\"أدخل بريدًا إلكترونيًا صحيحًا من فضلك.\",\"formService\":\"ما الذي تحتاجه؟\",\"formServicePlaceholder\":\"اختر خدمة\",\"formServiceError\":\"اختر خدمة من فضلك.\",\"serviceWebApps\":\"منصة ويب أو لوحة تحكم\",\"serviceRag\":\"نظام ذكاء اصطناعي / RAG\",\"serviceAutomation\":\"أتمتة أو أدوات MCP / CI\",\"serviceOther\":\"شيء آخر\",\"formBudget\":\"الميزانية\",\"formBudget__1k\":\"أقل من 1000$\",\"formBudget_1k_3k\":\"1000$ – 3000$\",\"formBudget_3k_10k\":\"3000$ – 10000$\",\"formBudget_10k_plus\":\"أكثر من 10000$\",\"formBudget_unsure\":\"غير محدد بعد\",\"formTimeline\":\"الموعد\",\"formTimeline_asap\":\"في أقرب وقت ممكن\",\"formTimeline_1_month\":\"خلال شهر\",\"formTimeline_quarter\":\"خلال هذا الربع\",\"formTimeline_flexible\":\"مرن\",\"formMessage\":\"الرسالة\",\"formMessageError\":\"اكتب بين 20 و2000 حرف من فضلك.\",\"formOptional\":\"اختياري\",\"formSubmit\":\"أرسل الاستفسار\",\"formSubmitting\":\"جارٍ الإرسال…\",\"formErrorSummary\":\"صحّح الحقول المحددة من فضلك.\",\"formErrorVerification\":\"فشل التحقق — أعد المحاولة أو استخدم البريد المباشر أدناه.\",\"formErrorRateLimited\":\"محاولات كثيرة الآن — انتظر بضع دقائق أو استخدم البريد المباشر أدناه.\",\"formErrorGeneric\":\"حدث خطأ ما ولم تُحفظ رسالتك. استخدم البريد المباشر أدناه من فضلك.\",\"formSuccessTitle\":\"تم الحفظ — سأعود إليك\",\"formSuccessBody\":\"حُفظ استفسارك. وإن أحببت، يمكنك الوصول إليّ مباشرة في أي وقت:\",\"formPrivacyNote\":\"محمي بواسطة Cloudflare Turnstile. التفاصيل في سياسة الخصوصية.\",\"formFallbackNote\":\"تفضّل البريد؟ هذا يعمل دائمًا، حتى لو تعطّل النموذج:\"},\"privacy\":{\"title\":\"سياسة الخصوصية\",\"updated\":\"آخر تحديث: 7 نوفمبر 2026\",\"introTitle\":\"ما تغطيه هذه السياسة\",\"introBody\":\"تشرح هذه السياسة ما يحدث للبيانات على fotedev.me، وهي مكتوبة لتُقرأ لا للاختباء خلفها.\",\"currentTitle\":\"ما يُجمع\",\"currentBody\":\"لا شيء سوى ما تكتبه بنفسك في نموذج التواصل (انظر أدناه). لا تحليلات، ولا متتبعات إعلانية، ولا ملفات تعريف ارتباط. الشيء الوحيد الآخر المخزّن في متصفحك هو تفضيل المظهر (فاتح أو داكن) في localStorage، وهو لا يغادر جهازك أبدًا.\",\"hostingTitle\":\"الاستضافة\",\"hostingBody\":\"يستضاف الموقع على Vercel. وكما في أي مستضيف، تعالج Vercel سجلات الطلبات القياسية (عنوان IP، وكيل المستخدم، الرابط المطلوب) لأغراض الأمان والتشغيل. تحليلات Vercel وSpeed Insights غير مفعّلة حاليًا؛ وإن تغيّر ذلك، فتُحدَّث هذه السياسة أولًا.\",\"formTitle\":\"نموذج التواصل\",\"formBody\":\"يجمع النموذج اسمك وبريدك الإلكتروني ورسالتك وخيارات الخدمة والميزانية والموعد (اختيارية)، بهدف واحد: الرد على استفسارك. تُفحص الطلبات بواسطة Cloudflare Turnstile (فحص روبوتات صديق للخصوصية) وتخضع لحدود معدل؛ ولأغراض الحماية من الإساءة نخزّن فقط بصمة مشفّرة ومملّحة لشبكتك — لا نعنوان IP الخام أبدًا. تُخزَّن الاستفسارات في قاعدة بيانات Supabase بمنطقة الاتحاد الأوروبي (فرانكفورت)، مع وصول مقصور عليّ، وتُحذف بعد 24 شهرًا من آخر رسالة في المحادثة، أو قبل ذلك بناءً على طلبك.\",\"deletionTitle\":\"بياناتك وقرارك\",\"deletionBody\":\"يمكنك أن تطلب مني حذف بياناتك في أي وقت: راسلني على fote.engineer@gmail.com وسأحذف الاستفسار وأؤكد لك الحذف.\",\"questionsTitle\":\"أسئلة\",\"questionsBody\":\"أي استفسار حول هذه السياسة: fote.engineer@gmail.com.\"},\"footer\":{\"tagline\":\"تطبيقات ويب وأدوات ذكاء اصطناعي مبنية حول عملك.\",\"navLabel\":\"تذييل الصفحة\",\"pagesLabel\":\"الصفحات\",\"connectLabel\":\"تواصل\",\"copyEmail\":\"نسخ عنوان البريد\",\"copied\":\"تم النسخ\",\"useSystemTheme\":\"استخدم مظهر النظام\",\"rights\":\"© {year} أحمد أبو العيون · الكود: AGPL-3.0-only · المحتوى والأصول: جميع الحقوق محفوظة.\",\"builtWith\":\"بُني علنًا عبر مصنع برمجيات حتمي.\"},\"theme\":{\"toggle\":\"تبديل مظهر الألوان\",\"reset\":\"استخدم مظهر النظام\"},\"localeSwitcher\":{\"label\":\"اللغة\",\"switchToAria\":\"التبديل إلى {name}\",\"en\":\"English\",\"ar\":\"العربية\"},\"oss\":{\"merged\":\"مدموج\",\"open\":\"طلب دمج مفتوح\",\"acknowledged\":\"إفصاح مُقرّ به\",\"verifiedOn\":\"تم التحقق في {date}\",\"viewOnGithub\":\"عرض على GitHub\",\"mergedVia\":\"مدموج عبر #{number}\"},\"credential\":{\"recipient\":\"المُستلِم\",\"viewPdf\":\"عرض PDF (تبويب جديد)\",\"downloadPdf\":\"تنزيل PDF\",\"pdfLinkNote\":\"يُفتح ملف الشهادة خارج هذا الموقع.\"},\"notFound\":{\"title\":\"الصفحة غير موجودة\",\"body\":\"الصفحة التي تبحث عنها غير موجودة أو تم نقلها.\",\"backHome\":\"العودة للرئيسية\"}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L1d\"}]\n"])</script><script>self.__next_f.push([1,"1e:I[43494,[\"$17\",\"$18\",\"$19\"],\"MotionProvider\"]\n1f:I[2874,[\"$17\",\"$18\",\"$19\"],\"Navbar\"]\n1d:[\"$\",\"$L1e\",null,{\"children\":[[\"$\",\"a\
