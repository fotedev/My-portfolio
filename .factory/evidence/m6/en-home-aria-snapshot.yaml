        - paragraph: "Automations and agent tooling that connect the systems you already use: MCP servers, scheduled jobs, data sync between systems, and deterministic CI pipelines that make every change testable and reversible."
        - link "All services":
          - /url: /en/services
    - region "How I work":
      - heading "How I work" [level=2]
      - paragraph: A deterministic factory, not improvised code.
      - list:
        - listitem:
          - heading "Spec first" [level=3]
          - paragraph: "Every build starts from a short written spec you approve: scope, constraints, and what \"done\" means, before any code exists."
        - listitem:
          - heading "Vertical slices" [level=3]
          - paragraph: Work ships in thin, working slices you can open and use, not a big reveal at the end.
        - listitem:
          - heading "CI-enforced gates" [level=3]
          - paragraph: Lint, types, tests and build run automatically on every change. Nothing merges without passing.
        - listitem:
          - heading "Handover" [level=3]
          - paragraph: "You get documentation, deployment and the keys: a system you own and understand."
