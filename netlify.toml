# Netlify spike (M6) — trial deploy for the hosting decision (ADR-0002).
# This branch exists ONLY for the spike: it is NOT merged to main while
# Vercel hosts production. It adds nothing to the app itself — the Next.js
# runtime is auto-installed, and noindex for non-canonical hosts already
# comes from src/proxy.ts (any host other than fotedev.me is noindexed).
[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
